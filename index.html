<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE連携</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f5f5f5;
      text-align: center;
    }
    .loading {
      margin-top: 60px;
      font-size: 16px;
      color: #666;
      line-height: 1.8;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 20px auto;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #06c755;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="loading">
  <div class="spinner"></div>
  <p id="status">LINE連携中です...<br>しばらくお待ちください</p>
</div>
<script>
(function() {
  var GAS_URL = 'https://script.google.com/macros/s/AKfycby8VhunD91kdd5afQwbAfIP9Ebepvm-8RuAQ32Dyj8Jc6cjreXyxdXFuILuDtvRxz25Cg/exec';
  var LIFF_ID = '2006336075-Q4E1eNov';
  var LINE_OA_URL = 'https://lin.ee/z3dvWhm';
  function setStatus(text) {
    var el = document.getElementById('status');
    if (el) el.innerHTML = text;
  }
  function getParam(name) {
    var match = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return match ? decodeURIComponent(match[1]) : '';
  }
  function goToChat() {
    window.location.href = LINE_OA_URL;
  }
  function sendLineData(uid, lineUserId, lineDisplayName) {
    var params = [
      'action=line',
      'uid=' + encodeURIComponent(uid),
      'line_user_id=' + encodeURIComponent(lineUserId),
      'line_display_name=' + encodeURIComponent(lineDisplayName),
      'callback=_liff'
    ].join('&');
    // JSONPでGASへ送信。GASはcallback指定時にJavaScriptを返すため、
    // scriptタグで受ける必要がある（Imageでは実行されない）
    window._liff = function() {
      setTimeout(goToChat, 300);
    };
    var s = document.createElement('script');
    s.src = GAS_URL + '?' + params;
    s.onerror = function() {
      setTimeout(goToChat, 700);
    };
    document.body.appendChild(s);
    // 念のため、3秒後には必ず遷移
    setTimeout(goToChat, 3000);
  }
  liff.init({
    liffId: LIFF_ID
  })
  .then(function() {
    setStatus('LINEログイン確認中です...<br>しばらくお待ちください');
    if (!liff.isLoggedIn()) {
      liff.login({
        redirectUri: window.location.href
      });
      return null;
    }
    return liff.getProfile();
  })
  .then(function(profile) {
    if (!profile) return;
    var uid = getParam('uid');
    if (!uid) {
      console.error('uid is missing');
      setStatus('uidが取得できませんでした。<br>LINEへ移動します。');
      setTimeout(goToChat, 1000);
      return;
    }
    setStatus('LINE情報を記録中です...<br>しばらくお待ちください');
    var lineUserId = profile.userId || '';
    var lineDisplayName = profile.displayName || '';
    sendLineData(uid, lineUserId, lineDisplayName);
  })
  .catch(function(err) {
    console.error('LIFF Error:', err);
    setStatus('LINE連携でエラーが発生しました。<br>LINEへ移動します。');
    setTimeout(goToChat, 1000);
  });
})();
</script>
</body>
</html>
